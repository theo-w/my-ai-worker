services:
  - type: web
    name: jarvis-loophole-playtest
    runtime: python
    plan: free
    branch: main
    buildCommand: python -m compileall -q mvp
    startCommand: python -m mvp.server
    healthCheckPath: /api/llm/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: HOST
        value: 0.0.0.0
      - key: JARVIS_PUBLIC_DEMO
        value: "false"
      - key: JARVIS_ADMIN_TOKEN
        sync: false
