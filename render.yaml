services:
  - type: web
    name: my-ai-worker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JARVIS_STORE_PATH
        value: /var/data/runtime.json
    disk:
      name: jarvis-runtime-data
      mountPath: /var/data
      sizeGB: 1
